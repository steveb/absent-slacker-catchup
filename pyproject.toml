[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "absent-slacker-catchup"
version = "0.1.0"
description = "Summarise the previous hours of an OpenStack IRC channel"
authors = [
    {name = "Steve Baker", email = "sbaker@redhat.com"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "markdown>=3.5",
    "openai>=1.40",
    "piper-tts>=1.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
]

[project.scripts]
asc = "asc.cli:main"

[project.urls]
Homepage = "https://github.com/steveb/absent-slacker-catchup"
Repository = "https://github.com/steveb/absent-slacker-catchup"
Issues = "https://github.com/steveb/absent-slacker-catchup/issues"

[tool.setuptools.packages.find]
include = ["asc*"]

[tool.setuptools.package-data]
asc = ["templates/*.j2", "templates/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
