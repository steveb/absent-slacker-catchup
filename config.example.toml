# Copy to config.toml (or pass --config PATH) to override the built-in defaults.
# Every key is optional; unknown keys are logged and ignored.

[general]
channel = "#openstack-ironic"
# How far back to look, in hours.
window_hours = 14
# Run directories are created here, named <channel>-<timestamp>.
output_dir = "output"
# CHAT, SUMMARY or SPEECH_SUMMARY.
output_type = "CHAT"
# Also write a machine-readable summary.json in the run directory.
write_json = false
# true / false force the browser launch, remove the key to auto-detect a desktop
# session.
# open_browser = true
# request_timeout = 30

[irc]
base_url = "https://meetings.opendev.org/irclogs"
# Nicknames whose messages are dropped entirely.
ignore_nicks = ["opendevreview"]
# Regexes matched against a nickname; matching messages are dropped.
bot_patterns = [
  "^opendevreview$",
  "^openstack(gerrit|zuul|infra)$",
  "^zuul$",
  "-bot$",
  "\\[bot\\]$",
]
# Hard stop for the log scan, so a quiet channel cannot loop forever.
max_days = 31

[summary]
model = "hf.co/mradermacher/Josiefied-DeepSeek-R1-0528-Qwen3-8B-abliterated-v1-i1-GGUF:Q4_K_M"
# Upper bound on the generated summary length, in tokens.
num_predict = 1024
# Leave unset to use the ollama default host (or $OLLAMA_HOST).
# ollama_host = "http://localhost:11434"

[tts]
# The Piper voice model. A relative name is looked up in model_dir, then in the
# current directory.
model = "en_GB-jenny_dioco-medium.onnx"
model_dir = "~/.local/share/asc/models"
